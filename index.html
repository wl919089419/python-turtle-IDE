<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐢 Python Turtle 编程乐园</title>

<!-- CodeMirror -->
<link rel="stylesheet" href="lib/codemirror/codemirror.min.css">
<link rel="stylesheet" href="lib/codemirror/dracula.min.css">
<!-- Font Awesome -->
<link rel="stylesheet" href="lib/fontawesome/css/all.min.css">

<style>
/* ===== Custom Offline Fonts ===== */
@font-face {
  font-family: 'MaShanZheng';
  src: url('lib/fonts/MaShanZheng-Regular.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'Ma Shan Zheng';
  src: url('lib/fonts/MaShanZheng-Regular.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'ZCOOLKuaiLe';
  src: url('lib/fonts/ZCOOLKuaiLe-Regular.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'ZCOOL KuaiLe';
  src: url('lib/fonts/ZCOOLKuaiLe-Regular.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'PressStart2P';
  src: url('lib/fonts/PressStart2P-Regular.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'Press Start 2P';
  src: url('lib/fonts/PressStart2P-Regular.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'Pacifico';
  src: url('lib/fonts/Pacifico-Regular.ttf') format('truetype');
  font-display: swap;
}

/* ===== CSS Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-dark:    #0f0f1a;
  --bg-panel:   #1a1a2e;
  --bg-card:    #16213e;
  --bg-input:   #0d1117;
  --accent:     #7c3aed;
  --accent2:    #06b6d4;
  --accent3:    #10b981;
  --danger:     #ef4444;
  --warn:       #f59e0b;
  --text:       #e2e8f0;
  --text-muted: #94a3b8;
  --border:     #2d3748;
  --radius:     12px;
  --radius-sm:  8px;
  --shadow:     0 4px 24px rgba(0,0,0,0.4);
}

body {
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ===== Top Header ===== */
#header {
  background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e3a5f 100%);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.5);
  flex-shrink: 0;
  border-bottom: 2px solid var(--accent);
}

#header .logo {
  font-size: 24px;
  font-weight: 900;
  background: linear-gradient(90deg, #a78bfa, #34d399, #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
  white-space: nowrap;
}

#header .header-logo-img {
  height: 36px;
  width: auto;
  object-fit: contain;
  display: block;
}

#header .spacer { flex: 1; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s ease;
  white-space: nowrap;
  letter-spacing: 0.5px;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.btn:active { transform: translateY(0); }

.btn-run   { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.btn-stop  { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
.btn-clear { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
.btn-save  { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
.btn-grid  { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; font-size: 13px; padding: 8px 14px; }
.btn-file  { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: var(--text); font-size: 13px; padding: 8px 14px; }
.btn-file:hover { background: rgba(255,255,255,0.16); border-color: var(--accent2); color: #fff; }
.btn-sm    { font-size: 13px; padding: 7px 12px; }

/* ===== Main Layout ===== */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 0;
}

/* ===== Left Panel ===== */
#left-panel {
  width: 340px;
  min-width: 300px;
  background: var(--bg-panel);
  display: flex;
  flex-direction: column;
  border-right: 2px solid var(--border);
  overflow: hidden;
}

#editor-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-bottom: 2px solid var(--border);
}

#editor-label {
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
}

.CodeMirror {
  font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace !important;
  font-size: 14px !important;
  line-height: 1.6 !important;
  height: 100% !important;
  flex: 1;
}
.CodeMirror-scroll { height: 100%; }

/* ===== Left Sidebar Panels ===== */
#sidebar-panels {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
  max-height: 55vh;
}
#sidebar-panels::-webkit-scrollbar { width: 5px; }
#sidebar-panels::-webkit-scrollbar-track { background: var(--bg-panel); }
#sidebar-panels::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.panel-section {
  border-bottom: 1px solid var(--border);
}

.panel-header {
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 800;
  color: var(--accent2);
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
  letter-spacing: 0.5px;
  transition: background 0.15s;
}
.panel-header:hover { background: #1e2d45; }
.panel-header .toggle-icon { margin-left: auto; transition: transform 0.2s; font-size: 11px; }
.panel-header.collapsed .toggle-icon { transform: rotate(-90deg); }

.panel-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.panel-body.hidden { display: none; }

/* ===== Color Palette ===== */
#color-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  padding: 2px;
}

.color-swatch {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2.5px solid rgba(255,255,255,0.15);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  position: relative;
}
.color-swatch:hover {
  transform: scale(1.25);
  box-shadow: 0 0 10px rgba(255,255,255,0.4);
  border-color: rgba(255,255,255,0.7);
  z-index: 1;
}
.color-swatch[data-color="white"] { border-color: #666; }

.custom-color-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}
.custom-color-row label {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}
#custom-color {
  width: 44px;
  height: 32px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  padding: 2px;
  background: none;
}

/* ===== Color Target Segmented Tabs ===== */
.color-target-selector {
  display: flex;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px;
  gap: 3px;
  margin-bottom: 8px;
}
.color-target-btn {
  flex: 1;
  background: transparent;
  border: none;
  border-radius: 5px;
  color: var(--text-muted);
  font-size: 11.5px;
  font-family: inherit;
  font-weight: 700;
  padding: 5px 2px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.color-target-btn:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.05);
}
.color-target-btn.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(124, 58, 237, 0.4);
}

/* ===== Accordion for Snippets ===== */
.snippet-category { border-bottom: 1px solid var(--border); }
.snippet-cat-header {
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 700;
  color: #a78bfa;
  background: rgba(124,58,237,0.1);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
  transition: background 0.15s;
}
.snippet-cat-header:hover { background: rgba(124,58,237,0.2); }
.snippet-cat-header .cat-arrow { margin-left: auto; font-size: 10px; transition: transform 0.2s; }
.snippet-cat-header.collapsed .cat-arrow { transform: rotate(-90deg); }

.snippet-cat-body { padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
.snippet-cat-body.hidden { display: none; }

.snippet-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-size: 12.5px;
  font-family: inherit;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.snippet-btn:hover {
  background: rgba(124,58,237,0.2);
  border-color: var(--accent);
  transform: translateX(3px);
}
.snippet-btn .snippet-icon { font-size: 14px; flex-shrink: 0; }
.snippet-btn .snippet-label { font-weight: 600; }
.snippet-btn .snippet-code {
  margin-left: auto;
  font-family: "Consolas", monospace;
  font-size: 11px;
  color: #60a5fa;
  opacity: 0.8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 150px;
}

/* ===== Write Snippet Widget ===== */
.write-widget-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 6px;
}
.write-widget-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.write-widget-row label,
.write-field label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 700;
  white-space: nowrap;
}
.write-widget-row input {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  padding: 4px 8px;
  outline: none;
}
.write-widget-row input:focus {
  border-color: var(--accent2);
}
.write-widget-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 8px;
}
.write-field {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.write-field select {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 11.5px;
  padding: 4px 6px;
  outline: none;
  cursor: pointer;
}
.write-field select:focus {
  border-color: var(--accent2);
}
.write-code-preview {
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 10.5px;
  color: #38bdf8;
  background: #090d16;
  padding: 6px 8px;
  border-radius: 4px;
  border: 1px solid rgba(6, 182, 212, 0.2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  user-select: all;
}
.btn-insert-write {
  background: linear-gradient(135deg, #7c3aed, #4f46e5);
  color: #fff;
  justify-content: center;
  padding: 7px 12px;
  font-size: 12px;
  width: 100%;
}

/* ===== Right: Canvas Area ===== */
#right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-dark);
  min-width: 0;
  overflow: hidden;
}

#canvas-toolbar {
  padding: 8px 16px;
  background: var(--bg-card);
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
#canvas-toolbar .tb-label {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: 0.5px;
}
#canvas-toolbar .spacer { flex: 1; }

#coord-display {
  font-size: 13px;
  color: var(--accent2);
  font-family: "Consolas", monospace;
  background: rgba(6,182,212,0.1);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid rgba(6,182,212,0.3);
  display: none;
  white-space: nowrap;
}

#canvas-wrap {
  flex: 1;
  display: flex;
  background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 100%);
  overflow: hidden;
  position: relative;
  padding: 0;
}

#canvas-container {
  position: relative;
  flex: 1;
  overflow: hidden;
  background: #ffffff;
}

/* Skulpt turtle renders into #turtle-target div */
#turtle-target {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
/* The canvas Skulpt creates inside turtle-target */
#turtle-target canvas {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
}

#gridcanvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 10;
  display: none;
}

/* ===== Input Dialog ===== */
#input-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 9999;
  align-items: center;
  justify-content: center;
}
#input-overlay.active { display: flex; }
#input-dialog {
  background: var(--bg-panel);
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  padding: 24px 28px;
  min-width: 320px;
  max-width: 480px;
  width: 90%;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#input-dialog .dlg-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--accent2);
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 0.5px;
}
#input-prompt-text {
  font-size: 14px;
  color: var(--text);
  line-height: 1.6;
  font-family: "JetBrains Mono", "Consolas", monospace;
  background: var(--bg-input);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  border: 1px solid var(--border);
  min-height: 32px;
}
#input-field {
  padding: 10px 14px;
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 15px;
  font-family: "JetBrains Mono", "Consolas", monospace;
  outline: none;
  transition: border-color 0.15s;
}
#input-field:focus { border-color: var(--accent2); }
#input-dialog .dlg-actions { display: flex; gap: 10px; justify-content: flex-end; }
#btn-input-ok {
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 9px 22px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
#btn-input-ok:hover { opacity: 0.9; }

/* ===== Console ===== */
#console-wrap {
  flex-shrink: 0;
  border-top: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  max-height: 160px;
}

#console-header {
  padding: 6px 14px;
  background: var(--bg-card);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 0.5px;
  user-select: none;
  border-bottom: 1px solid var(--border);
}
#console-header:hover { background: #1e2d45; }
#console-toggle-icon { margin-left: auto; transition: transform 0.2s; }
#console-header.collapsed #console-toggle-icon { transform: rotate(-90deg); }

#console-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 14px;
  background: #0d1117;
  font-family: "JetBrains Mono", "Consolas", monospace;
  font-size: 12.5px;
  line-height: 1.6;
  min-height: 60px;
}
#console-body::-webkit-scrollbar { width: 5px; }
#console-body::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 3px; }
#console-body.hidden { display: none; }

.console-line { margin: 1px 0; }
.console-out  { color: #34d399; }
.console-err  { color: #f87171; }
.console-info { color: #60a5fa; }
.console-sys  { color: #94a3b8; font-style: italic; }

/* ===== Tooltip ===== */
.tooltip-wrap { position: relative; }
.tooltip-wrap:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #e2e8f0;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  z-index: 999;
  border: 1px solid var(--border);
}

/* ===== Scrollbar global ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ===== Running indicator ===== */
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.running-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #10b981;
  display: inline-block;
  animation: pulse 1s infinite;
}
</style>
</head>
<body>

<!-- Hidden font warmup elements to force browser to load and decode webfonts immediately on page open -->
<div style="position:fixed;left:-9999px;top:-9999px;opacity:0;pointer-events:none;z-index:-1;" aria-hidden="true">
  <span style="font-family:'MaShanZheng'">预热字体</span>
  <span style="font-family:'ZCOOLKuaiLe'">预热字体</span>
  <span style="font-family:'PressStart2P'">WARMUP</span>
  <span style="font-family:'Pacifico'">Warmup</span>
</div>

<!-- ===== HEADER ===== -->
<div id="header">
  <img src="assets/logo.png" alt="makcoo" class="header-logo-img">
  <div class="spacer"></div>
  <button class="btn btn-file" id="btn-open-file" title="打开本地 Python 文件 (.py)"><i class="fas fa-folder-open"></i> 打开文件</button>
  <button class="btn btn-file" id="btn-export-code" title="导出代码为 .py 文件"><i class="fas fa-download"></i> 导出代码</button>
  <button class="btn btn-run" id="btn-run-stop"><i class="fas fa-play"></i> 运行</button>
  <button class="btn btn-clear" id="btn-clear"><i class="fas fa-trash-alt"></i> 清除</button>
  <input type="file" id="file-py-input" accept=".py,.txt" style="display:none">
</div>

<!-- ===== MAIN ===== -->
<div id="main">

  <!-- LEFT PANEL -->
  <div id="left-panel">

    <!-- Editor -->
    <div id="editor-wrap">
      <div id="editor-label">
        <i class="fas fa-code"></i> Python 代码编辑器
        <span id="run-indicator" style="margin-left:auto;display:none">
          <span class="running-dot"></span>
          <span style="font-size:11px;color:#10b981;margin-left:4px">运行中…</span>
        </span>
      </div>
      <textarea id="code-editor"></textarea>
    </div>

    <!-- Sidebar panels -->
    <div id="sidebar-panels">

      <!-- Color Palette -->
      <div class="panel-section">
        <div class="panel-header" onclick="togglePanel(this)">
          <span>🎨</span> 颜色面板
          <span class="toggle-icon"><i class="fas fa-chevron-down"></i></span>
        </div>
        <div class="panel-body">
          <div class="color-target-selector">
            <button type="button" class="color-target-btn active" data-type="pencolor" onclick="setColorTarget('pencolor')">✏️ 画笔色</button>
            <button type="button" class="color-target-btn" data-type="fillcolor" onclick="setColorTarget('fillcolor')">🪣 填充色</button>
            <button type="button" class="color-target-btn" data-type="bgcolor" onclick="setColorTarget('bgcolor')">🖼️ 背景色</button>
          </div>
          <div id="color-grid"></div>
          <div class="custom-color-row">
            <label id="custom-color-label">🖌️ 自定义画笔色：</label>
            <input type="color" id="custom-color" value="#ff6b6b" title="选择自定义颜色">
            <button class="btn btn-sm" onclick="insertCustomColor()"
              style="background:linear-gradient(135deg,#ec4899,#be185d);color:#fff;padding:5px 10px;font-size:12px;">
              插入
            </button>
          </div>
        </div>
      </div>

      <!-- Snippet Panel -->
      <div class="panel-section">

<script>
/* =====================================================
   CANVAS RESIZE: grid canvas fills canvas-wrap
   ===================================================== */
function getCanvasSize() {
  const container = document.getElementById('canvas-container');
  let w = Math.floor(container.clientWidth  || container.offsetWidth  || 800);
  let h = Math.floor(container.clientHeight || container.offsetHeight || 600);
  // Ensure even dimensions so origin (w/2, h/2) lands on precise integer pixel
  if (w % 2 !== 0) w -= 1;
  if (h % 2 !== 0) h -= 1;
  return { w, h };
}

function resizeGridCanvas() {
  const gc = document.getElementById('gridcanvas');
  const { w, h } = getCanvasSize();
  gc.width  = w;
  gc.height = h;
  gc.style.width  = w + 'px';
  gc.style.height = h + 'px';
  if (gridVisible) drawGrid();
}

// Keep painted turtle content aligned and centered with the canvas origin on window resize
function handleResize() {
  const { w: newW, h: newH } = getCanvasSize();
  const gc = document.getElementById('gridcanvas');
  const oldW = gc.width || newW;
  const oldH = gc.height || newH;

  const target = document.getElementById('turtle-target');
  if (target && (oldW !== newW || oldH !== newH)) {
    const dx = (newW - oldW) / 2;
    const dy = (newH - oldH) / 2;
    const canvases = Array.from(target.querySelectorAll('canvas'));

    canvases.forEach(cvs => {
      if (cvs.width > 0 && cvs.height > 0) {
        const temp = document.createElement('canvas');
        temp.width = cvs.width;
        temp.height = cvs.height;
        const tctx = temp.getContext('2d');
        tctx.drawImage(cvs, 0, 0);

        cvs.width = newW;
        cvs.height = newH;
        cvs.style.width = newW + 'px';
        cvs.style.height = newH + 'px';

        const ctx = cvs.getContext('2d');
        ctx.drawImage(temp, dx, dy);
      }
    });
  }

  resizeGridCanvas();
}

window.addEventListener('resize', handleResize);
setTimeout(handleResize, 100);

/* =====================================================
   EDITOR SETUP
   ===================================================== */
const STARTER_CODE = `import turtle

# 🐢 欢迎来到 Python Turtle 编程乐园！

turtle.shape("turtle")

/* =====================================================
   CODE INSERTION UTILITY
   ===================================================== */
function insertCode(snippet) {
  editor.focus();
  const cursor = editor.getCursor();
  const lineContent = editor.getLine(cursor.line) || '';

  // If cursor is at start of empty line, insert there; otherwise go to new line
  let insertPos;
  if (lineContent.trim() === '') {
    insertPos = { line: cursor.line, ch: 0 };
    editor.replaceRange('', insertPos, { line: cursor.line, ch: lineContent.length });
  } else {
    // Move to end of current line
    insertPos = { line: cursor.line, ch: lineContent.length };
    snippet = '\n' + snippet;
  }

  // Ensure snippet ends with newline
  if (!snippet.endsWith('\n')) snippet += '\n';

  editor.replaceRange(snippet, insertPos);

  // Move cursor to end of inserted text
  const lines = snippet.split('\n');
  const newLine = insertPos.line + lines.length - 1;
  const newCh = lines[lines.length - 1].length;
  editor.setCursor({ line: newLine, ch: newCh });
  editor.focus();
}

/* =====================================================

let isRunning = false;
let currentPromise = null;

/* =====================================================
   TURTLE PRELUDE: Built-in rect() and helpers
   ===================================================== */
const TURTLE_PRELUDE = `import turtle

def rect(w, h, x=0, y=0, linewidth=1):
    _down = turtle.isdown() if hasattr(turtle, "isdown") else True
    _h = turtle.heading()
    _sz = turtle.pensize()
    turtle.penup()
    # (x, y) 为矩形左上角定位坐标
    turtle.goto(x, y)
    turtle.setheading(0)
    if linewidth == 0:
        turtle.begin_fill()
        for _ in range(2):
            turtle.forward(w)
            turtle.right(90)
            turtle.forward(h)
            turtle.right(90)
        turtle.end_fill()
    else:
        turtle.pensize(linewidth)
        turtle.pendown()
        for _ in range(2):
            turtle.forward(w)
            turtle.right(90)
            turtle.forward(h)
            turtle.right(90)
        turtle.penup()
    turtle.setheading(_h)
    turtle.pensize(_sz)
    if _down:
        turtle.pendown()

turtle.rect = rect

_orig_turtle_write = turtle.write
def write(arg, move=False, align="left", font=("Arial", 14, "normal")):
    if isinstance(font, (list, tuple)) and len(font) >= 3:
        fname = str(font[0]).strip()
        font_map = {
            "Ma Shan Zheng": "MaShanZheng",
            "书法体": "MaShanZheng",
            "楷体": "MaShanZheng",
            "ZCOOL KuaiLe": "ZCOOLKuaiLe",
            "快乐体": "ZCOOLKuaiLe",
            "卡通体": "ZCOOLKuaiLe",
            "Press Start 2P": "PressStart2P",
            "像素体": "PressStart2P",
            "复古体": "PressStart2P",
            "Pacifico": "Pacifico",
            "手写体": "Pacifico",
            "花体": "Pacifico",
            "微软雅黑": "Microsoft YaHei",
            "黑体": "SimHei",
            "宋体": "SimSun"
        }
        if fname in font_map:
            fname = font_map[fname]
        font = (fname, font[1], font[2])
    return _orig_turtle_write(arg, move, align, font)

turtle.write = write
`;
const PRELUDE_LINES = TURTLE_PRELUDE.split('\n').length - 1;

function configSkulpt() {
  const { w, h } = getCanvasSize();

  Sk.configure({
    output: function(text) {
      if (text && text !== '\n') appendConsole(text.replace(/\n$/, ''), 'out');
    },
    inputfun: function(prompt) {
      appendConsole('⌨️ ' + (prompt || '等待输入…'), 'info');
      return showInputDialog(prompt || '');
    },
    inputfunTakesPrompt: true,
    read: function(x) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
        throw "File not found: '" + x + "'";
      return Sk.builtinFiles["files"][x];
    },
    __future__: Sk.python3,
    execLimit: null,
  });
  Sk.TurtleGraphics = {
    target: 'turtle-target',
    width:  w,
    height: h,
    worldWidth:  w,
    worldHeight: h,
    animate: true,
  };
}

/* =====================================================
   ANIMATION FRAME / TIMER TRACKER (for force-stop)
   ===================================================== */
let _trackedRAFs     = new Set();
let _trackedTimers   = new Set();
let _origRAF         = window.requestAnimationFrame.bind(window);
let _origCAF         = window.cancelAnimationFrame.bind(window);
let _origSetTimeout  = window.setTimeout.bind(window);
let _origClearTimeout= window.clearTimeout.bind(window);

function _startTracking() {
  _trackedRAFs.clear();
  _trackedTimers.clear();
  window.requestAnimationFrame = function(cb) {
    const id = _origRAF(cb);
    _trackedRAFs.add(id);
    return id;
  };
  window.cancelAnimationFrame = function(id) {
    _trackedRAFs.delete(id);
    return _origCAF(id);
  };
  window.setTimeout = function(fn, delay) {
    const id = _origSetTimeout(fn, delay);
    _trackedTimers.add(id);
    return id;
  };
  window.clearTimeout = function(id) {
    _trackedTimers.delete(id);
    return _origClearTimeout(id);
  };
}

function _stopTracking() {
  window.requestAnimationFrame = _origRAF;
  window.cancelAnimationFrame  = _origCAF;
  window.setTimeout  = _origSetTimeout;
  window.clearTimeout= _origClearTimeout;
}

function _cancelAllPending() {
  _trackedRAFs.forEach(id   => { try { _origCAF(id);         } catch(e){} });
  _trackedTimers.forEach(id => { try { _origClearTimeout(id);} catch(e){} });
  _trackedRAFs.clear();
  _trackedTimers.clear();
}

function setRunningUI(running) {
  const btn = document.getElementById('btn-run-stop');
  const indicator = document.getElementById('run-indicator');
  if (running) {
    btn.className = 'btn btn-stop';
    btn.innerHTML = '<i class="fas fa-stop"></i> 停止';
    indicator.style.display = 'flex';
  } else {
    btn.className = 'btn btn-run';
    btn.innerHTML = '<i class="fas fa-play"></i> 运行';
    indicator.style.display = 'none';
  }
}

// Preload web fonts so canvas renders correctly on very first execution
function preloadFonts() {
  if (document.fonts && document.fonts.load) {
    document.fonts.load('16px "MaShanZheng"');
    document.fonts.load('16px "ZCOOLKuaiLe"');
    document.fonts.load('16px "PressStart2P"');
    document.fonts.load('16px "Pacifico"');
  }
}
preloadFonts();

// Each run gets a unique token; stale promise callbacks compare and bail out
let _runToken = 0;

async function runCode() {
  if (isRunning) { stopCode(); return; }
  clearConsole();
  appendConsole('▶ 开始运行…', 'sys');
  isRunning = true;
  _runToken++;
  const myToken = _runToken;
  setRunningUI(true);

  // Ensure all fonts are loaded and ready before canvas starts drawing
  if (document.fonts && document.fonts.ready) {
    try {
      await document.fonts.ready;
    } catch(e) {}
  }
  if (_runToken !== myToken) return; // stopped while waiting for fonts

  // Clear turtle target and reset Skulpt turtle module instance cache
  const turtleTarget = document.getElementById('turtle-target');
  if (turtleTarget) {
    if (turtleTarget.turtleInstance && typeof turtleTarget.turtleInstance.reset === 'function') {
      try { turtleTarget.turtleInstance.reset(); } catch(e){}
    }
    delete turtleTarget.turtleInstance;
    turtleTarget.innerHTML = '';
  }
  if (Sk.sysmodules) {
    delete Sk.sysmodules['turtle'];
    delete Sk.sysmodules['src/lib/turtle.js'];
  }

  _startTracking();   // start intercepting RAF / setTimeout
  configSkulpt();

  const userCode = editor.getValue();
  const codeToRun = TURTLE_PRELUDE + userCode;

  currentPromise = Sk.misceval.asyncToPromise(function() {
    return Sk.importMainWithBody("<stdin>", false, codeToRun, true);
  });

  currentPromise.then(function() {
    _stopTracking();
    if (_runToken !== myToken) return;   // already force-stopped
    appendConsole('✅ 运行完成！', 'sys');
    stopRunning();
  }, function(err) {
    _stopTracking();
    if (_runToken !== myToken) return;   // already force-stopped
    let msg = err && err.toString ? err.toString() : String(err);
    if (msg.includes('ExecLimit') || msg.includes('forcibly') || msg.includes('Interrupt')) {
      // silently ignore — stopCode() already printed the message
    } else {
      // Adjust error line number by removing prelude lines
      msg = msg.replace(/on line (\d+)/g, function(match, num) {
        const line = parseInt(num, 10) - PRELUDE_LINES;
        return `on line ${line > 0 ? line : 1}`;
      });
      appendConsole('❌ 错误: ' + msg, 'err');
      document.getElementById('console-err-badge').style.display = 'inline';
    }
    stopRunning();
  });
}

function stopCode() {
  if (!isRunning) return;
  // 1. Invalidate current run's promise callbacks
  _runToken++;
  // 2. Cancel all pending animation frames and timers Skulpt queued
  _cancelAllPending();
  _stopTracking();
  // 3. Try to interrupt Skulpt's Python loop too
  try { Sk.execLimit = 1; } catch(e) {}
  // 4. Close any open input() dialog immediately
  if (_inputResolve) {
    document.getElementById('input-overlay').classList.remove('active');
    const r = _inputResolve;
    _inputResolve = null;
    r('');
  }
  appendConsole('⏹ 已停止。', 'sys');
  // 5. Reset UI immediately — don't wait for the promise
  stopRunning();
}

function stopRunning() {
  isRunning = false;
  try { Sk.execLimit = null; } catch(e) {}
  setRunningUI(false);
}

function clearCanvas() {
  if (isRunning) { stopCode(); }
  document.getElementById('turtle-target').innerHTML = '';
  if (gridVisible) drawGrid();
  appendConsole('🗑️ 画布已清除。', 'sys');
}

document.getElementById('btn-run-stop').addEventListener('click', function() {

});

/* =====================================================
   SAVE IMAGE (Feature 1 - Merge all layers)
   ===================================================== */
function saveImage() {
  const { w, h } = getCanvasSize();

  const offscreen = document.createElement('canvas');
  offscreen.width  = w;
  offscreen.height = h;
  const ctx = offscreen.getContext('2d');

  // 1. White background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  // 2. Draw all turtle layers in order (background, drawing paper, sprites)
  const target = document.getElementById('turtle-target');
  if (target) {
    const canvases = Array.from(target.querySelectorAll('canvas'));
    canvases
      .filter(c => c.style.display !== 'none' && c.width > 0 && c.height > 0)
      .forEach(c => {
        try {
          ctx.drawImage(c, 0, 0);
        } catch(e) {}
      });
  }

  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const ts = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

  const link = document.createElement('a');
  link.download = `turtle_${ts}.png`;
  link.href = offscreen.toDataURL('image/png');
  link.click();

  appendConsole(`💾 图片已保存：turtle_${ts}.png`, 'info');
}

/* =====================================================
   GRID & COORDINATE OVERLAY (Feature 2)
   ===================================================== */
let gridVisible = false;

function toggleGrid() {
  gridVisible = !gridVisible;
  const gc = document.getElementById('gridcanvas');
  const btn = document.getElementById('btn-grid');
  const coordDisp = document.getElementById('coord-display');

  if (gridVisible) {
    gc.style.display = 'block';
    coordDisp.style.display = 'inline-flex';
    btn.innerHTML = '<i class="fas fa-th"></i> 隐藏坐标系';
    btn.style.background = 'linear-gradient(135deg, #be185d, #9d174d)';
    drawGrid();
  } else {
    gc.style.display = 'none';
    coordDisp.style.display = 'none';
    btn.innerHTML = '<i class="fas fa-th"></i> 显示坐标系';
    btn.style.background = '';
  }
}

function drawGrid() {
  const gc = document.getElementById('gridcanvas');
  const ctx = gc.getContext('2d');
  const W = gc.width;
  const H = gc.height;
  const cx = W / 2;   // pixel position of turtle (0,0)
  const cy = H / 2;
  const STEP = 50;    // pixels per grid unit

  ctx.clearRect(0, 0, W, H);

  // ---- Minor grid lines (centered on cx, cy so lines pass through origin) ----
  ctx.strokeStyle = 'rgba(160,170,210,0.15)';
  ctx.lineWidth = 1;

  // Vertical lines: start from cx going left and right in steps of STEP
  for (let x = cx % STEP; x <= W; x += STEP) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  // Horizontal lines: start from cy going up and down
  for (let y = cy % STEP; y <= H; y += STEP) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // ---- Axes ----
  ctx.strokeStyle = 'rgba(99,179,237,0.75)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke(); // X axis
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke(); // Y axis

  // ---- Tick marks + labels ----
  ctx.font = '10px "JetBrains Mono", Consolas, monospace';

  // X axis ticks (from center outward)
  for (let px = cx + STEP; px < W - 4; px += STEP) {
    const val = Math.round(px - cx);
    ctx.strokeStyle = 'rgba(99,179,237,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, cy - 4); ctx.lineTo(px, cy + 4); ctx.stroke();
    ctx.fillStyle = 'rgba(148,163,184,0.8)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(String(val), px, cy + 7);
  }
  for (let px = cx - STEP; px > 4; px -= STEP) {
    const val = Math.round(px - cx);
    ctx.strokeStyle = 'rgba(99,179,237,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, cy - 4); ctx.lineTo(px, cy + 4); ctx.stroke();
    ctx.fillStyle = 'rgba(148,163,184,0.8)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(String(val), px, cy + 7);
  }

  // Y axis ticks (turtle Y is flipped: up=positive)
  for (let py = cy - STEP; py > 4; py -= STEP) {
    const val = Math.round(cy - py);
    ctx.strokeStyle = 'rgba(99,179,237,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - 4, py); ctx.lineTo(cx + 4, py); ctx.stroke();
    ctx.fillStyle = 'rgba(148,163,184,0.8)';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(String(val), cx - 7, py);
  }
  for (let py = cy + STEP; py < H - 4; py += STEP) {
    const val = Math.round(cy - py);
    ctx.strokeStyle = 'rgba(99,179,237,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - 4, py); ctx.lineTo(cx + 4, py); ctx.stroke();
    ctx.fillStyle = 'rgba(148,163,184,0.8)';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(String(val), cx - 7, py);
  }

  // ---- Origin dot + label ----
  ctx.fillStyle = 'rgba(99,179,237,0.95)';
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
  ctx.font = 'bold 10px "JetBrains Mono", Consolas, monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('(0,0)', cx + 5, cy - 4);

  // ---- Axis direction labels ----
  ctx.font = 'bold 11px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(99,179,237,0.85)';
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('+X →', W - 6, cy - 4);
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('← -X', 6, cy - 4);
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText('+Y', cx - 5, 5);
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('-Y', cx - 5, H - 5);

  // ---- Arrow heads ----
  ctx.fillStyle = 'rgba(99,179,237,0.75)';
  drawArrow(ctx, W - 12, cy, W - 1, cy);
  drawArrow(ctx, 12, cy, 1, cy);
  drawArrow(ctx, cx, 12, cx, 1);
  drawArrow(ctx, cx, H - 12, cx, H - 1);
}

function drawArrow(ctx, fromX, fromY, toX, toY) {
  const headLen = 8;
  const angle = Math.atan2(toY - fromY, toX - fromX);
  ctx.beginPath();
  ctx.moveTo(toX, toY);
  ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI/6), toY - headLen * Math.sin(angle - Math.PI/6));
  ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI/6), toY - headLen * Math.sin(angle + Math.PI/6));
  ctx.closePath();
  ctx.fill();
}

// Mouse coordinate tracking
const canvasContainer = document.getElementById('canvas-container');
canvasContainer.addEventListener('mousemove', function(e) {
  if (!gridVisible) return;
  const rect = canvasContainer.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const W  = canvasContainer.clientWidth;
  const H  = canvasContainer.clientHeight;
  if (mx < 0 || my < 0 || mx > W || my > H) return;
  const tx = Math.round(mx - W / 2);
  const ty = Math.round(H / 2 - my);
  document.getElementById('coord-display').textContent = `📍 坐标: (${tx}, ${ty})`;
});

let currentColorTarget = 'pencolor'; // 'pencolor' | 'fillcolor' | 'bgcolor'

function setColorTarget(type) {
  currentColorTarget = type;
  document.querySelectorAll('.color-target-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-type') === type);
  });
  const labelMap = {
    pencolor: '🖌️ 自定义画笔色：',
    fillcolor: '🪣 自定义填充色：',
    bgcolor: '🖼️ 自定义背景色：'
  };
  const labelEl = document.getElementById('custom-color-label');
  if (labelEl && labelMap[type]) {
    labelEl.textContent = labelMap[type];
  }
  updateSwatchTooltips();
}

function getColorSnippet(colorVal) {
  if (currentColorTarget === 'fillcolor') {
    return `turtle.fillcolor("${colorVal}")`;
  } else if (currentColorTarget === 'bgcolor') {
    return `turtle.bgcolor("${colorVal}")`;
  }
  return `turtle.pencolor("${colorVal}")`;
}

function updateSwatchTooltips() {
  const prefixMap = {
    pencolor: '画笔色: ',
    fillcolor: '填充色: ',
    bgcolor: '背景色: '
  };
  const prefix = prefixMap[currentColorTarget] || '';
  document.querySelectorAll('#color-grid .color-swatch').forEach(swatch => {
    const cname = swatch.getAttribute('data-color');
    swatch.title = prefix + cname;
    swatch.setAttribute('data-tip', prefix + cname);
  });
}

(function buildColorGrid() {
  const grid = document.getElementById('color-grid');
  COLORS.forEach(c => {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch tooltip-wrap';
    swatch.style.background = c.hex;
    swatch.setAttribute('data-color', c.name);
    swatch.setAttribute('data-tip', '画笔色: ' + c.name);
    swatch.title = '画笔色: ' + c.name;
    swatch.addEventListener('click', () => {
      insertCode(getColorSnippet(c.name));
    });
    grid.appendChild(swatch);
  });
})();

function insertCustomColor() {
  const hex = document.getElementById('custom-color').value;
  insertCode(getColorSnippet(hex));
}

document.getElementById('custom-color').addEventListener('change', function() {

(function buildSnippetPanel() {
  const container = document.getElementById('snippet-panel-body');

  SNIPPET_CATEGORIES.forEach(cat => {
    // Category header
    const catDiv = document.createElement('div');
    catDiv.className = 'snippet-category';

    const header = document.createElement('div');
    header.className = 'snippet-cat-header';
    header.innerHTML = `<span>${cat.icon}</span> ${cat.label} <span class="cat-arrow"><i class="fas fa-chevron-down"></i></span>`;
    header.addEventListener('click', () => {
      header.classList.toggle('collapsed');
      body.classList.toggle('hidden');
    });

    const body = document.createElement('div');
    body.className = 'snippet-cat-body';

    // Support custom rendered widget cards (e.g. write function with dropdowns)
    if (typeof cat.customRender === 'function') {
      cat.customRender(body);
    }

    if (Array.isArray(cat.snippets)) {
      cat.snippets.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'snippet-btn';

        btn.innerHTML = `
          <span class="snippet-icon">${s.icon}</span>
          <span class="snippet-label">${s.label}</span>
          <span class="snippet-code">${s.display}</span>
        `;
        btn.addEventListener('click', () => insertCode(s.code));
        body.appendChild(btn);
      });
    }

    catDiv.appendChild(header);
    catDiv.appendChild(body);
    container.appendChild(catDiv);
  });
})();
